name: Auto-Release Builder

on:
  push:
    branches:
      - main
    paths:
      - 'dam.sh'

jobs:
  release:
    # Ignore commits made by the bot itself to prevent infinite loops
    if: "!contains(github.event.head_commit.message, '🚀 Release v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate New Version and Update Script
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the latest release tag from GitHub API (or local git tags as a fallback)
          CURRENT_VERSION=$(gh release view --json tagName -q .tagName 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null)
          
          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "Error: Could not determine the current version from GitHub or local tags!"
            exit 1
          fi
          CURRENT_VERSION=${CURRENT_VERSION#v}
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          
          # Calculate new version based on tags in your commit message
          if [[ "$COMMIT_MSG" == *"[major]"* ]]; then
            NEW_VERSION="$((major + 1)).0.0"
          elif [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
            NEW_VERSION="${major}.$((minor + 1)).0"
          else
            NEW_VERSION="${major}.${minor}.$((patch + 1))"
          fi
          
          echo "Bumping from $CURRENT_VERSION to $NEW_VERSION"
          
          # Update the version safely in dam.sh
          CURRENT_VERSION_ESCAPED="${CURRENT_VERSION//./\\.}"
          sed -i "s/^#VERSION=\"${CURRENT_VERSION_ESCAPED}\"/#VERSION=\"${NEW_VERSION}\"/g" dam.sh
          
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true

      - name: Commit version bump
        run: |
          git commit -am "🚀 Release v${{ env.NEW_VERSION }}"
          git push

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the official GitHub CLI to create the release and tag
          gh release create "v${{ env.NEW_VERSION }}" \
            --title "v${{ env.NEW_VERSION }}" \
            --generate-notes
