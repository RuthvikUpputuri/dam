name: Auto-Release Builder

on:
  push:
    branches:
      - main
    paths:
      - 'dam.sh'

jobs:
  release:
    # Ignore commits made by the bot itself to prevent infinite loops
    if: "!contains(github.event.head_commit.message, '🚀 Release v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate New Version and Update Script
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the latest release tag from GitHub API (or local git tags as a fallback)
          CURRENT_VERSION=$(gh release view --json tagName -q .tagName 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null)
          
          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "Error: Could not determine the current version from GitHub or local tags!"
            exit 1
          fi
          CURRENT_VERSION=${CURRENT_VERSION#v}
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          
          # Calculate new version based on tags in your commit message
          if [[ "$COMMIT_MSG" == *"[major]"* ]]; then
            NEW_VERSION="$((major + 1)).0.0"
          elif [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
            NEW_VERSION="${major}.$((minor + 1)).0"
          else
            NEW_VERSION="${major}.${minor}.$((patch + 1))"
          fi
          
          echo "Bumping from $CURRENT_VERSION to $NEW_VERSION"
          
          # Update the version safely in dam.sh
          CURRENT_VERSION_ESCAPED="${CURRENT_VERSION//./\\.}"
          sed -i "s/^# \?VERSION=\"${CURRENT_VERSION_ESCAPED}\"/# VERSION=\"${NEW_VERSION}\"/" dam.sh
          
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "PREV_TAG=v$CURRENT_VERSION" >> $GITHUB_ENV
          echo "TRIGGER_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true

      - name: Commit version bump
        env:
          ORIGINAL_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Extract just the first line (subject) of the triggering commit
          FIRST_LINE=$(echo "$ORIGINAL_MSG" | head -n 1)
          git commit -am "🚀 Release v${{ env.NEW_VERSION }} - $FIRST_LINE"
          git push

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          RANGE="${PREV_TAG}..${TRIGGER_SHA}"
          NOTES=release_notes.md
          : > "$NOTES"

          # Group commits by conventional-commit prefix; skip bot release commits
          section() {
            local title="$1" pattern="$2" out
            out=$(git log --no-merges --format='%h%x09%s' "$RANGE" \
              | grep -v $'\t🚀 Release v' \
              | grep -E "$pattern" \
              | while IFS=$'\t' read -r sha subj; do
                  subj=$(sed -E 's/^[a-zA-Z]+(\([^)]*\))?!?: *//' <<< "$subj")
                  echo "- ${subj} ([\`${sha}\`](${REPO_URL}/commit/${sha}))"
                done)
            [[ -n "$out" ]] && printf '### %s\n\n%s\n\n' "$title" "$out" >> "$NOTES"
            return 0
          }

          echo "## What's Changed" >> "$NOTES"
          echo >> "$NOTES"
          section "✨ New Features"   $'\t(feat)(\\(.*\\))?!?:'
          section "🐛 Bug Fixes"      $'\t(fix)(\\(.*\\))?!?:'
          section "📚 Documentation"  $'\t(docs)(\\(.*\\))?!?:'
          section "⚙️ CI & Maintenance" $'\t(ci|chore|build|refactor|perf|test|style)(\\(.*\\))?!?:'
          # Anything without a recognised prefix
          other=$(git log --no-merges --format='%h%x09%s' "$RANGE" \
            | grep -v $'\t🚀 Release v' \
            | grep -Ev $'\t(feat|fix|docs|ci|chore|build|refactor|perf|test|style)(\\(.*\\))?!?:' \
            | while IFS=$'\t' read -r sha subj; do
                echo "- ${subj} ([\`${sha}\`](${REPO_URL}/commit/${sha}))"
              done)
          [[ -n "$other" ]] && printf '### 🔧 Other Changes\n\n%s\n\n' "$other" >> "$NOTES"

          # Commit bodies carry the detailed explanation
          details=$(git log --no-merges --reverse --format='#### %s%n%n%b%n' "$RANGE" \
            | awk 'BEGIN{RS="#### ";ORS=""} NR>1 { n=split($0,l,"\n"); body=""; for(i=2;i<=n;i++) body=body l[i] "\n"; if (body ~ /[^[:space:]]/ && l[1] !~ /^🚀 Release v/) print "#### " $0 }')
          [[ -n "$details" ]] && printf '### 📝 Details\n\n%s\n\n' "$details" >> "$NOTES"

          printf '### 📄 Changed Files\n\n```\n%s\n```\n\n' \
            "$(git diff --stat "${PREV_TAG}" "${TRIGGER_SHA}" | tail -n 20)" >> "$NOTES"
          printf '**Full Changelog**: %s/compare/%s...v%s\n' \
            "$REPO_URL" "$PREV_TAG" "$NEW_VERSION" >> "$NOTES"

          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes-file "$NOTES"
