name: Shellcheck

on:
  push:
    branches: [ "main" ]
    paths:
      - 'dam.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'dam.sh'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    name: Run Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax Check
        run: bash -n dam.sh
      - name: Run Shellcheck
        run: shellcheck dam.sh
